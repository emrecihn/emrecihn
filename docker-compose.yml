version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: heybeli-postgres
    environment:
      POSTGRES_DB: heybeli
      POSTGRES_USER: heybeli
      POSTGRES_PASSWORD: heybeli
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: heybeli-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./apps/api
    container_name: heybeli-api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://heybeli:heybeli@postgres:5432/heybeli
      REDIS_URL: redis://redis:6379
      JWT_SECRET: replace-me
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis

  storefront:
    build:
      context: ./apps/storefront
    container_name: heybeli-storefront
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

  admin:
    build:
      context: ./apps/admin
    container_name: heybeli-admin
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3001:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
